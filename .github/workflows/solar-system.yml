name: Solar System Workflow
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - features/*
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: Checkout code

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
