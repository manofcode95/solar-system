name: Solar System Workflow
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/*

jobs:
  unit-test:
    runs-on: ubuntu-latest
    services:
      mongo-db:
        image: mongo
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: secret
    env:
        MONGO_URI: mongodb://root:secret@localhost:27017/superData?authSource=admin
    steps:
      - uses: actions/checkout@v3
        name: Checkout code

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies    
        run: npm install
  

      - name: Run tests
        run: npm test
      
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results.xml
  coverage-test:
    runs-on: ubuntu-latest
    
    container:
      image: node:18

    services:
      mongo-db:
        image: mongo
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: secret

    env:
      MONGO_URI: mongodb://root:secret@localhost:27017/superData?authSource=admin

    steps:
      - uses: actions/checkout@v3
        name: Checkout code

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install


      - name: Run coverage tests
        run: npm run coverage
        continue-on-error: true
      
      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: coverage
          retention-days: 5

  container:
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    permissions:
      packages: write
    runs-on: [self-hosted, macOS, ARM64]
    needs: [unit-test, coverage-test]
    steps:
      - uses: actions/checkout@v3
        name: Checkout code

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
     
      - name: Docker Build
        uses: docker/build-push-action@v5
        with:
          buildx-version: latest
          context: .
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
      
      - name: Docker Image Test
        run: |
          docker images
          docker run --name solar-system-${{ github.run_id }}-${{ github.run_attempt }} -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3000/live | grep -q live; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm --force solar-system-${{ github.run_id }}-${{ github.run_attempt }} || true

      - name: Docker Push
        uses: docker/build-push-action@v5
        with:
          buildx-version: latest
          context: .
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
      
  prod-deploy:
    needs: container
    uses: ./.github/workflows/reuse-deployment.yml
    with:
      k8s_path: kubernetes/development
      image: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
      environment: production
  

  integration-test:
    needs: prod-deploy
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Test URL Output using curl and jq
        env: 
          URL: ${{ needs.prod-deploy.outputs.application-url }}
        run: |
          echo $URL
          echo "-------------------------"
          curl $URL/live -s -k | jq -r .status  | grep -i live